# SAE feature exploration on baseline dev generations, one SAE per run:
#   python experiments/sae_explore.py --config configs/sae_explore.yaml -o sae=llamascope_l19
model_id: deepseek-ai/DeepSeek-R1-Distill-Llama-8B
baseline_dir: artifacts/baseline/baseline
benchmarks: [gsm8k_dev, humanevalplus_dev]
pools: [prompt_last, resp_mean]
top_k: 10
out_dir: artifacts/sae_explore
sae: llamascope_l19
descriptions:
  ls: &ls "Llama Scope R1-Distill (OpenMOSS / fnlp): a sparse autoencoder trained on this model's layer output, on 400M tokens of general web text (SlimPajama) plus 400M tokens of R1-style math reasoning traces (OpenR1-Math-220k). Feature dashboards are on Neuronpedia."
  paper: &paper "From 'I Have Covered All the Bases Here: Interpreting Reasoning Features in Large Language Models via Sparse Autoencoders' (Galichin et al. 2025), the paper Jason shared. Trained on this model's layer-19 output on 820M tokens of LMSYS chat and OpenThoughts reasoning traces. No Neuronpedia dashboards; feature numbers are this SAE's own indices."
saes:
  # Llama Scope R1-Distill, 32k features, trained on 400M SlimPajama + 400M OpenR1-Math tokens
  llamascope_l4:  {layer: 4,  release: llama_scope_r1_distill, sae_id: l4r_400m_slimpajama_400m_openr1_math,  neuronpedia: deepseek-r1-distill-llama-8b/4-llamascope-slimpj-openr1-res-32k, description: *ls}
  llamascope_l19: {layer: 19, release: llama_scope_r1_distill, sae_id: l19r_400m_slimpajama_400m_openr1_math, neuronpedia: deepseek-r1-distill-llama-8b/19-llamascope-slimpj-openr1-res-32k, description: *ls}
  llamascope_l29: {layer: 29, release: llama_scope_r1_distill, sae_id: l29r_400m_slimpajama_400m_openr1_math, neuronpedia: deepseek-r1-distill-llama-8b/29-llamascope-slimpj-openr1-res-32k, description: *ls}
  llamascope_l30: {layer: 30, release: llama_scope_r1_distill, sae_id: l30r_400m_slimpajama_400m_openr1_math, neuronpedia: deepseek-r1-distill-llama-8b/30-llamascope-slimpj-openr1-res-32k, description: *ls}
  # "I Have Covered All the Bases Here" (Galichin et al. 2025), 65k features, LMSYS + OpenThoughts
  paper_l19: {layer: 19, repo: andreuka18/deepseek-r1-distill-llama-8b-lmsys-openthoughts, path: blocks.19.hook_resid_post, description: *paper}
