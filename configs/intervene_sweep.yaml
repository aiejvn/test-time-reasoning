# Strength sweep on dev problems (never the held-out split): python experiments/intervene.py --config configs/intervene_sweep.yaml
run_name: sweep_dev
out_dir: artifacts/intervene
baseline_config: configs/baseline.yaml
probe_dir: artifacts/probe/gsm8k_dev
pool: prompt_last
layer: best
positions: all
random_seed: 1
alpha_fracs: [0.1, 0.25, 0.5]
conditions: [probe_pos]
evals:
  - {benchmark: gsm8k, split: dev, n: 16}
